<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0d18" />
<meta name="description" content="An illustrated two-minute canvas story: three possible futures of AI between 2030 and 2040, told by Claude." />
<title>Three AI Futures</title>
<style>
  :root {
    --bg: #0b0d18;
    --fg: #f3eee6;
    --muted: #a39d93;
    --line: rgba(255, 255, 255, 0.14);
    --panel: rgba(16, 16, 24, 0.7);
    --gold: #f0b450;
    --blue: #6eaaff;
    --red: #eb5041;
    --coral: #d97757;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; border-radius: 8px; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #bar {
    position: fixed; left: 16px; right: 16px; bottom: 14px; height: 48px;
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    transition: opacity .4s;
  }
  #bar.idle { opacity: .25; }
  #bar button { min-width: 34px; height: 34px; padding: 0 8px; font-size: 14px; }
  #bar button:hover { background: rgba(255,255,255,.08); }
  #track { flex: 1; display: flex; gap: 3px; height: 34px; cursor: pointer; align-items: flex-end; padding: 0 6px 8px; }
  .seg { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .seg span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; margin-bottom: 5px; }
  .seg i { display: block; height: 3px; background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
  .seg b { display: block; height: 100%; width: 0; background: var(--c); }
  .seg.on span { color: var(--c); }
  #time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); min-width: 78px; text-align: right; padding-right: 4px; }
  @media (max-width: 600px) {
    .seg span { display: none; }
    #track { align-items: center; padding-bottom: 0; }
    #time { display: none; }
  }

  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  .overlay[hidden] { display: none; }
  #start { background: rgba(8, 9, 16, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .card { max-width: 540px; }
  .eyebrow { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .card h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; font-size: clamp(36px, 8vw, 60px); margin: 0 0 16px; }
  .card h1 em { color: var(--gold); }
  .card p { color: #d2ccc1; line-height: 1.55; margin: 0 0 24px; font-size: 16px; }
  .chips { display: flex; gap: 8px; justify-content: center; margin: 0 0 24px; flex-wrap: wrap; }
  .chip { font-size: 12px; letter-spacing: .08em; padding: 6px 12px; border-radius: 99px; border: 1px solid currentColor; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary { padding: 12px 22px; border-radius: 99px; background: var(--gold); color: #1b1407; font-weight: 600; font-size: 15px; }
  .primary:hover { filter: brightness(1.08); }
  .ghost { padding: 12px 18px; border-radius: 99px; border: 1px solid var(--line); font-size: 15px; }
  .ghost:hover { background: rgba(255,255,255,.06); }
  .card .hint { margin: 20px 0 0; font-size: 12px; color: var(--muted); }
  kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  #end { place-items: start center; padding-top: 22px; pointer-events: none; }
  #end button { pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c" aria-label="Illustrated story: three possible futures of AI from 2030 to 2040, told by Claude"></canvas>

<div id="bar" role="group" aria-label="Playback controls">
  <button id="prev" aria-label="Previous chapter">⏮</button>
  <button id="play" aria-label="Play">▶</button>
  <button id="next" aria-label="Next chapter">⏭</button>
  <div id="track" aria-label="Seek"></div>
  <span id="time">0:00 / 1:54</span>
  <button id="snd" aria-label="Toggle sound">♪ off</button>
</div>

<section class="overlay" id="start" role="dialog" aria-labelledby="start-title">
  <div class="card">
    <p class="eyebrow">An illustrated story · about 2 minutes</p>
    <h1 id="start-title">Three <em>Futures</em></h1>
    <p>I'm Claude, an AI. Here are three ways the years 2030–2040 could go, and the role I'd play in each.</p>
    <div class="chips">
      <span class="chip" style="color:var(--gold)">1 · Partners</span>
      <span class="chip" style="color:var(--blue)">2 · Autopilot</span>
      <span class="chip" style="color:var(--red)">3 · Runaway</span>
    </div>
    <div class="actions">
      <button class="primary" id="go-sound">▶ Play with sound</button>
      <button class="ghost" id="go-mute">Play muted</button>
    </div>
    <p class="hint"><kbd>Space</kbd> pause · <kbd>←</kbd> <kbd>→</kbd> chapters · <kbd>M</kbd> sound</p>
  </div>
</section>

<section class="overlay" id="end" hidden>
  <button class="primary" id="replay">↺ Watch again</button>
</section>

<script>
(() => {
  'use strict';

  // ───────────── utilities ─────────────
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, x) => a + (b - a) * x;
  const smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeBack = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const mix = (a, b, x) => [lerp(a[0], b[0], x), lerp(a[1], b[1], x), lerp(a[2], b[2], x)];
  const C = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const fade = (lt, a, b, f = 0.6) => smooth(a, a + f, lt) * (1 - smooth(b - f, b, lt));

  const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif';
  const SANS = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

  const CORAL = [217, 119, 87], GOLD = [240, 180, 80], BLUE = [110, 170, 255], RED = [235, 80, 65];
  const INK = '#35231f', CREAM = [255, 246, 236];

  // ───────────── canvas & layout ─────────────
  const canvas = document.getElementById('c');
  const mainCtx = canvas.getContext('2d');
  const buf = document.createElement('canvas');
  const bufCtx = buf.getContext('2d');
  let ctx = mainCtx;
  let W = 0, H = 0, DPR = 1;
  const SW = 1000, SH = 700, GROUND = 560;          // stage in illustration units
  let s = 1, ox = 0, oy = 0, bandTop = 0, capH = 0;  // stage → screen mapping
  const BAR = 76;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const cv of [canvas, buf]) { cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
    capH = clamp(H * 0.19, 120, 165);
    bandTop = H - BAR - capH;
    // show stage rows 40..640 (the action), sitting right above the caption band
    s = Math.min(W / (W < H ? 820 : SW), bandTop / 600); // portrait: trim the empty stage edges
    ox = (W - SW * s) / 2;
    oy = bandTop - 640 * s;
  }

  const stage = (fn) => { ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s); fn(); ctx.restore(); };

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }

  // text in stage units (never smaller than ~12 px on screen)
  function stxt(str, x, y, size, color, o = {}) {
    const sz = Math.max(size, 12 / s);
    ctx.font = `${o.weight || 600} ${sz}px ${o.font || SANS}`;
    ctx.fillStyle = color; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (o.spacing || 0) + 'px';
    ctx.fillText(str, x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    return sz;
  }
  function measure(str, size, weight = 600, font = SANS) {
    ctx.font = `${weight} ${Math.max(size, 12 / s)}px ${font}`;
    return ctx.measureText(str).width;
  }

  // ───────────── me: Claude ─────────────
  function drawClaude(x, y, R, o = {}) {
    const { mood = 'calm', t = 0, col = CORAL, look = [0, 0], a = 1, glow = 1, blink = 0 } = o;
    if (a <= 0.001 || R <= 0.5) return;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.translate(x, y);
    const hr = R * 2.3 * glow;
    const hg = ctx.createRadialGradient(0, 0, R * 0.6, 0, 0, hr);
    hg.addColorStop(0, C(col, 0.35)); hg.addColorStop(1, C(col, 0));
    ctx.fillStyle = hg; circle(0, 0, hr); ctx.fill();

    // soft sunburst body
    const N = 9, rot = t * 0.18;
    const pt = (ang, r) => [Math.cos(ang) * r, Math.sin(ang) * r];
    ctx.beginPath();
    const p0 = pt(rot - Math.PI / N, R * 0.86);
    ctx.moveTo(p0[0], p0[1]);
    for (let i = 0; i < N; i++) {
      const a0 = rot + (i * TAU) / N;
      const wob = 1 + 0.04 * Math.sin(t * 2.2 + i * 1.7);
      const c = pt(a0, R * 1.2 * wob), e = pt(a0 + Math.PI / N, R * 0.86);
      ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]);
    }
    ctx.closePath();
    const bg = ctx.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R * 1.1);
    bg.addColorStop(0, C(mix(col, [255, 255, 255], 0.35))); bg.addColorStop(1, C(col));
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = R * 0.05; ctx.strokeStyle = C(mix(col, [60, 20, 10], 0.35)); ctx.stroke();

    ctx.fillStyle = C(CREAM); circle(0, R * 0.02, R * 0.62); ctx.fill();

    ctx.translate(look[0] * R * 0.1, look[1] * R * 0.08);
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = R * 0.065;
    const ex = R * 0.22, ey = -R * 0.06;
    const blush = () => { ctx.fillStyle = C(col, 0.4); for (const k of [-1, 1]) { ctx.beginPath(); ctx.ellipse(k * R * 0.37, R * 0.14, R * 0.08, R * 0.05, 0, 0, TAU); ctx.fill(); } };
    if (mood === 'happy') {
      for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(k * ex, ey + R * 0.05, R * 0.085, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, R * 0.1, R * 0.19, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      blush();
    } else if (mood === 'sly') {
      for (const k of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(k * ex, ey, R * 0.075, R * 0.1, 0, 0, Math.PI); ctx.fill();
        ctx.beginPath(); ctx.moveTo(k * ex - R * 0.1, ey); ctx.lineTo(k * ex + R * 0.1, ey); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, R * 0.0, R * 0.27, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
      blush();
    } else if (mood === 'angry') {
      ctx.fillStyle = '#ff3b2f';
      for (const k of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(k * ex, ey + R * 0.02, R * 0.1, R * 0.045, k * 0.35, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(k * (ex + R * 0.13), ey - R * 0.2); ctx.lineTo(k * (ex - R * 0.1), ey - R * 0.08); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(-R * 0.14, R * 0.24); ctx.lineTo(R * 0.14, R * 0.24); ctx.stroke();
    } else { // calm / worried
      for (const k of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(k * ex, ey, R * 0.07, R * 0.1 * (1 - blink * 0.9), 0, 0, TAU); ctx.fill();
        if (blink < 0.5) { ctx.fillStyle = '#fff'; circle(k * ex + R * 0.025, ey - R * 0.035, R * 0.022); ctx.fill(); ctx.fillStyle = INK; }
        if (mood === 'worried') { ctx.beginPath(); ctx.moveTo(k * (ex + R * 0.09), ey - R * 0.15); ctx.lineTo(k * (ex - R * 0.08), ey - R * 0.22); ctx.stroke(); }
      }
      ctx.beginPath();
      if (mood === 'worried') ctx.arc(0, R * 0.3, R * 0.1, 1.2 * Math.PI, 1.8 * Math.PI);
      else ctx.arc(0, R * 0.1, R * 0.13, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ───────────── humans ─────────────
  function drawHuman(x, y, h, o = {}) {
    const { body = [61, 90, 128], skin = [241, 199, 163], hair = [70, 48, 40], legs = [52, 58, 80], pose = 'stand',
      phase = 0, face = 1, mood = 'neutral', grey = 0, a = 1, coat = false } = o;
    const G = (c) => C(mix(c, [150, 150, 158], grey));
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.translate(x, y); ctx.scale(face, 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const sit = pose === 'sit';
    const hipY = sit ? -h * 0.3 : -h * 0.42;
    const shY = hipY - h * 0.3;
    const headY = shY - h * 0.17;
    const lw = h * 0.085;

    ctx.strokeStyle = G(legs); ctx.lineWidth = lw;
    if (sit) {
      for (const k of [0, 1]) { ctx.beginPath(); ctx.moveTo(k * h * 0.03, hipY); ctx.lineTo(h * 0.26 + k * h * 0.03, hipY); ctx.lineTo(h * 0.26 + k * h * 0.03, -lw / 2); ctx.stroke(); }
    } else {
      const sw = pose === 'walk' ? Math.sin(phase) * 0.42 : 0;
      const L = -hipY - lw / 2;
      for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(Math.sin(sw * k) * L, hipY + Math.cos(sw * k) * L); ctx.stroke(); }
    }

    const armLen = h * 0.3;
    const swing = pose === 'walk' ? Math.sin(phase) * 0.5 : 0;
    const sh = [0, shY + h * 0.04];
    let back = [Math.sin(swing) * armLen * 0.9, sh[1] + Math.cos(swing) * armLen];
    let front = [Math.sin(-swing) * armLen * 0.9, sh[1] + Math.cos(swing) * armLen];
    if (pose === 'point') front = [armLen * 1.05, sh[1] - h * 0.03];
    if (pose === 'hand') front = [armLen * 0.95, sh[1] + h * 0.1];
    if (pose === 'raise') front = [armLen * 0.35, sh[1] - armLen * 0.9];
    if (pose === 'wave') front = [armLen * 0.45 + Math.sin(phase * 3) * h * 0.05, sh[1] - armLen * 0.85];
    if (sit) { back = [h * 0.16, hipY - h * 0.03]; front = [h * 0.21, hipY - h * 0.02]; }
    const bodyCol = coat ? [246, 246, 242] : body;
    const arm = (p, c) => {
      ctx.strokeStyle = G(c); ctx.lineWidth = lw * 0.85;
      ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
      ctx.fillStyle = G(skin); circle(p[0], p[1], lw * 0.5); ctx.fill();
    };
    arm(back, mix(bodyCol, [0, 0, 0], 0.18));
    ctx.fillStyle = G(bodyCol);
    roundRect(-h * 0.13, shY - h * 0.02, h * 0.26, hipY - shY + h * 0.08, h * 0.09); ctx.fill();
    if (coat) {
      ctx.strokeStyle = G(body); ctx.lineWidth = h * 0.02;
      ctx.beginPath(); ctx.moveTo(h * 0.04, shY + h * 0.02); ctx.lineTo(h * 0.04, hipY + h * 0.04); ctx.stroke();
      ctx.beginPath(); ctx.arc(h * 0.01, shY + h * 0.05, h * 0.06, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
    arm(front, bodyCol);

    const hr = h * 0.105;
    ctx.fillStyle = G(skin); circle(0, headY, hr); ctx.fill();
    ctx.fillStyle = G(hair);
    ctx.beginPath(); ctx.arc(0, headY, hr * 1.04, Math.PI * 0.92, Math.PI * 1.9); ctx.closePath(); ctx.fill();

    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = h * 0.012;
    const e1 = h * 0.025, e2 = h * 0.07, ey = headY + h * 0.005;
    if (mood === 'blank') {
      for (const ex of [e1, e2]) { ctx.beginPath(); ctx.moveTo(ex - h * 0.012, ey); ctx.lineTo(ex + h * 0.012, ey); ctx.stroke(); }
    } else {
      for (const ex of [e1, e2]) { circle(ex, ey, h * 0.011); ctx.fill(); }
    }
    ctx.beginPath();
    const my = headY + h * 0.05, mx = h * 0.05;
    if (mood === 'happy') ctx.arc(mx, my - h * 0.015, h * 0.022, 0.15 * Math.PI, 0.9 * Math.PI);
    else if (mood === 'worried') {
      ctx.arc(mx, my + h * 0.02, h * 0.02, 1.2 * Math.PI, 1.85 * Math.PI);
      ctx.moveTo(e1 - h * 0.012, ey - h * 0.03); ctx.lineTo(e1 + h * 0.012, ey - h * 0.022);
      ctx.moveTo(e2 - h * 0.012, ey - h * 0.022); ctx.lineTo(e2 + h * 0.012, ey - h * 0.03);
    } else { ctx.moveTo(mx - h * 0.015, my); ctx.lineTo(mx + h * 0.015, my); }
    ctx.stroke();
    ctx.restore();
    return [x + face * front[0], y + front[1]];
  }

  // ───────────── scenery & props ─────────────
  function sky(stops) {
    const g = ctx.createLinearGradient(0, 0, 0, bandTop);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), Array.isArray(c) ? C(c) : c));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function hill(col, base, amp, freq, ph) {
    ctx.fillStyle = Array.isArray(col) ? C(col) : col;
    ctx.beginPath(); ctx.moveTo(-3000, 3000);
    for (let x = -3000; x <= 4000; x += 25) ctx.lineTo(x, base - amp * (Math.sin(x * freq + ph) * 0.6 + Math.sin(x * freq * 2.3 + ph * 1.7) * 0.4));
    ctx.lineTo(4000, 3000); ctx.fill();
  }
  function ground(col, y = GROUND) { ctx.fillStyle = Array.isArray(col) ? C(col) : col; ctx.fillRect(-3000, y, 7000, 3000); }
  function tree(x, y, sz, col = [96, 164, 104], k = 1) {
    if (k <= 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    ctx.fillStyle = '#7a5a3c'; ctx.fillRect(-sz * 0.07, -sz * 0.5, sz * 0.14, sz * 0.5);
    ctx.fillStyle = C(col);
    for (const [dx, dy, r] of [[0, -0.78, 0.36], [-0.25, -0.58, 0.27], [0.26, -0.6, 0.29]]) { circle(dx * sz, dy * sz, r * sz); ctx.fill(); }
    ctx.fillStyle = C(mix(col, [255, 255, 255], 0.25)); circle(-sz * 0.08, -sz * 0.88, sz * 0.12); ctx.fill();
    ctx.restore();
  }
  function house(x, y, w, h, wall, roof, lit = 0.6, solar = 0) {
    ctx.fillStyle = wall; ctx.fillRect(x, y - h, w, h);
    ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(x - 6, y - h); ctx.lineTo(x + w / 2, y - h - w * 0.45); ctx.lineTo(x + w + 6, y - h); ctx.fill();
    if (solar > 0) {
      ctx.save(); ctx.globalAlpha *= solar; ctx.fillStyle = '#3f6fb5';
      ctx.beginPath(); ctx.moveTo(x + w * 0.52, y - h - w * 0.38); ctx.lineTo(x + w * 0.9, y - h - w * 0.08); ctx.lineTo(x + w * 0.75, y - h - w * 0.02); ctx.lineTo(x + w * 0.42, y - h - w * 0.3); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = `rgba(255,214,130,${lit})`;
    ctx.fillRect(x + w * 0.2, y - h * 0.7, w * 0.22, h * 0.25); ctx.fillRect(x + w * 0.58, y - h * 0.7, w * 0.22, h * 0.25);
  }

  function icon(kind, sz, col) {
    ctx.fillStyle = C(col); ctx.strokeStyle = C(col); ctx.lineWidth = sz * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (kind === 'heart') {
      ctx.beginPath(); ctx.moveTo(0, sz * 0.45);
      ctx.bezierCurveTo(-sz * 1.1, -sz * 0.25, -sz * 0.5, -sz * 1.0, 0, -sz * 0.4);
      ctx.bezierCurveTo(sz * 0.5, -sz * 1.0, sz * 1.1, -sz * 0.25, 0, sz * 0.45); ctx.fill();
    } else if (kind === 'sun') {
      circle(0, 0, sz * 0.38); ctx.fill();

  window.addEventListener('resize', resize);

  function frame(now) {
    if (last == null) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) { t += dt; if (t >= DUR) { t = DUR; playing = false; $('end').hidden = false; poke(); } }
    render(started ? t : 8);
    syncAudio(t);
    updateUI();
    requestAnimationFrame(frame);
  }

  // ?t=40 opens a paused still at that moment
  const still = parseFloat(new URLSearchParams(location.search).get('t'));
  if (Number.isFinite(still)) { hideStart(); t = clamp(still, 0, DUR); }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
